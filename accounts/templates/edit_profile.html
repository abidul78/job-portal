{% extends 'base.html' %}

{% block title %}
My Profile | JobPortal
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-2">
                    Applicant Profile
                </h2>

                <p class="text-muted">
                    Update your personal information, skills and experience.
                </p>

                <hr>

                <form
                    method="post"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Profile
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
