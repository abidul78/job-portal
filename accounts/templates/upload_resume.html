{% extends 'base.html' %}

{% block title %}
Resume | JobPortal
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold">
                    Resume
                </h2>

                <p class="text-muted">
                    Upload your latest resume for employers to review.
                </p>

                {% if user.resume %}

                    <div class="alert alert-success">

                        Current resume:

                        <a
                            href="{{ user.resume.url }}"
                            target="_blank"
                        >
                            View Resume
                        </a>

                    </div>

                {% endif %}

                <form
                    method="post"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Upload Resume
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
